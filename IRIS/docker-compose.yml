version: '3.8'

services:
  iris-ml-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iris-ml-web-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - THREADS=4
      - SECRET_KEY=prod-super-secret-key-iris-2026
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
